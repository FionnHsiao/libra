<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>find</title>
  </head>
  <body>
    <div class="bar">
      <input
        id="q"
        class="q"
        type="text"
        placeholder="在正文中查找"
        autocomplete="off"
        spellcheck="false"
        aria-label="在正文中查找"
      />
      <span id="count" class="count">0/0</span>
      <button id="prev" class="nav" type="button" title="上一个（Shift+Enter）" aria-label="上一个">↑</button>
      <button id="next" class="nav" type="button" title="下一个（Enter）" aria-label="下一个">↓</button>
      <button id="close" class="close" type="button" title="关闭（Esc）" aria-label="关闭">×</button>
    </div>
    <script type="module" src="./find/main.ts"></script>
  </body>
</html>
